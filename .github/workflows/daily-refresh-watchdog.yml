name: FG Inventory Daily Schedule Watchdog

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules can be delayed or dropped. Keep broad lightweight
    # coverage; separate backup workflows provide independent cron queues.
    # GitHub cron is UTC: 05:03-14:53 equals 10:33 AM-8:23 PM IST.
    - cron: "3,13,23,33,43,53 5-14 * * *"

permissions:
  actions: write
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/refresh-watchdog-core.yml
