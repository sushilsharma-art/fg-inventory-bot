name: FG Inventory Daily Cloud Refresh

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: Optional report date (YYYY-MM-DD)
        required: false
        type: string
      force_rebuild:
        description: Rebuild even if today's verified payload already exists
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub schedules use UTC. Staggered, non-round minutes reduce scheduler
    # congestion; every run exits quickly once today's verified snapshot exists.
    - cron: "15 5 * * *"
    - cron: "37 5 * * *"
    - cron: "59 5 * * *"
    - cron: "21 6 * * *"
    - cron: "43 6 * * *"

concurrency:
  group: fg-inventory-production
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out bot
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        run: python -m pip install -r requirements.txt

      - name: Restore durable secondary-sales history
        uses: actions/cache@v4
        with:
          path: data/secondary_sales_history.sqlite
          key: fg-secondary-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fg-secondary-history-${{ runner.os }}-

      - name: Build and validate current snapshot
        env:
          FG_BOT_PASSCODE: ${{ secrets.FG_BOT_PASSCODE }}
          FG_BOT_LOGIN_PASSCODE: ${{ secrets.FG_BOT_LOGIN_PASSCODE }}
          FG_BOT_DATA_URL: ${{ vars.FG_BOT_DATA_URL }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          TABLEAU_PAT_NAME: ${{ secrets.TABLEAU_PAT_NAME }}
          TABLEAU_PAT_SECRET: ${{ secrets.TABLEAU_PAT_SECRET }}
          TABLEAU_SERVER_URL: ${{ vars.TABLEAU_SERVER_URL }}
          TABLEAU_SITE_CONTENT_URL: ${{ vars.TABLEAU_SITE_CONTENT_URL }}
          TABLEAU_WORKBOOK_CONTENT_URL: ${{ vars.TABLEAU_WORKBOOK_CONTENT_URL }}
          TABLEAU_QUANTITY_VIEW: ${{ vars.TABLEAU_QUANTITY_VIEW }}
          TABLEAU_VALUE_VIEW: ${{ vars.TABLEAU_VALUE_VIEW }}
          INPUT_RUN_DATE: ${{ inputs.run_date }}
          INPUT_FORCE: ${{ inputs.force_rebuild }}
        shell: bash
        run: |
          # Inventory publication requires all three current-date operational
          # sources. Tableau is refreshed independently; if it is late, keep
          # the last reviewed Secondary metrics and expose their exact through date.
          args=(--refresh-tableau)
          if [[ -n "$INPUT_RUN_DATE" ]]; then args+=(--date "$INPUT_RUN_DATE"); fi
          if [[ "$INPUT_FORCE" == "true" ]]; then args+=(--force); fi
          python cloud_runner.py "${args[@]}"

      - name: Record one successful daily heartbeat
        continue-on-error: true
        shell: bash
        run: |
          if python -c 'import json; raise SystemExit(0 if json.load(open("site/status.json"))["status"] == "success" else 1)'; then
            status_date=$(python -c 'import json; print(json.load(open("site/status.json"))["report_date"])')
            mkdir -p state
            cp site/status.json state/last_success.json
            git config user.name "fg-inventory-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/last_success.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: record FG refresh $status_date"
              git push
            fi
          fi

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fg-inventory-run-${{ github.run_id }}
          path: work/**/quality_report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified snapshot
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Close resolved refresh alerts
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            for (const issue of issues.filter(i => i.title.startsWith("[FG BOT] Daily refresh failed"))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved by successful run ${context.runId}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
            }

  alert:
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Create one visible failure alert
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const reportDate = new Intl.DateTimeFormat("en-CA", {
              timeZone: "Asia/Kolkata",
              year: "numeric",
              month: "2-digit",
              day: "2-digit"
            }).format(new Date());
            const title = `[FG BOT] Daily refresh failed - ${reportDate}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            if (!open.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The current-date refresh did not pass publication gates. The previously successful chat snapshot remains live. Review workflow run ${context.runId}: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }
