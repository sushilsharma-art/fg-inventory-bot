name: FG Inventory Refresh Watchdog

on:
  workflow_dispatch:
  schedule:
    # Independent fallback checks every 30 minutes from 10:58 AM through
    # 2:28 PM IST. These avoid the top of the UTC hour, when GitHub schedules
    # are most likely to be delayed or dropped.
    - cron: "28,58 5-8 * * *"

permissions:
  actions: write
  contents: read

jobs:
  recover-missed-refresh:
    uses: ./.github/workflows/refresh-watchdog-core.yml
