<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FG Inventory Assistant</title>
<meta name="description" content="A secure, WhatsApp-style assistant for instant FG inventory, DOI, DRR, freshness and location answers.">
<meta property="og:title" content="FG Inventory Assistant">
<meta property="og:description" content="Ask inventory questions, get instant verified answers, and share them from any phone.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://sushilsharma-art.github.io/fg-inventory-bot/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="FG Inventory Assistant">
<meta name="twitter:description" content="Ask. Answer. Share.">
<meta name="twitter:image" content="https://sushilsharma-art.github.io/fg-inventory-bot/og.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#075e54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root {
    color-scheme: light;
    --wa-dark: #075e54;
    --wa-green: #008069;
    --wa-bright: #25d366;
    --wa-paper: #efeae2;
    --wa-mint: #d9fdd3;
    --ink: #111b21;
    --muted: #667781;
    --line: #d8dedc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "Segoe UI", Helvetica, Arial, sans-serif; background: linear-gradient(#00a884 0 118px,#d8dfe3 118px 100%); display: flex; justify-content: center; color: var(--ink); }
  button, input { font: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  #app { width: 100%; max-width: 860px; height: 100dvh; display: flex; flex-direction: column; background: var(--wa-paper); box-shadow: 0 8px 36px rgba(11,20,26,.28); }
  /* header */
  #hdr { background: var(--wa-dark); color: #fff; min-height: 68px; padding: calc(9px + env(safe-area-inset-top)) 14px 9px; display: flex; align-items: center; gap: 12px; flex: 0 0 auto; box-shadow: 0 1px 3px rgba(11,20,26,.24); z-index: 3; }
  #hdr .av { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(145deg,#46dd84,#15b957); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 15px; position: relative; box-shadow: inset 0 0 0 2px rgba(255,255,255,.24); }
  #hdr .av:after { content:""; width: 11px; height: 11px; border-radius: 50%; background: #53e07b; border: 2px solid var(--wa-dark); position: absolute; right: -1px; bottom: -1px; }
  #hdr .identity { min-width: 0; }
  #hdr .t { font-size: 16px; font-weight: 700; letter-spacing: -.1px; display:flex; align-items:center; gap:6px; }
  #hdr .verified { display:inline-grid; place-items:center; width:16px; height:16px; border-radius:50%; background:#53bdeb; font-size:11px; }
  #hdr .s { font-size: 12px; opacity: .88; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #hdr .actions { margin-left:auto; display:flex; align-items:center; gap:4px; }
  .icon-btn { border:0; background:transparent; color:#fff; width:42px; height:42px; border-radius:50%; cursor:pointer; font-size:20px; display:grid; place-items:center; opacity:.92; }
  .icon-btn:hover, .icon-btn:focus-visible { background:rgba(255,255,255,.12); outline:none; }
  /* chat area */
  #chat { flex: 1 1 auto; overflow-y: auto; padding: 18px 18px 10px; overscroll-behavior:contain; scrollbar-color:#aebac1 transparent;
    background-color: var(--wa-paper);
    background-image: radial-gradient(circle at 12px 14px,rgba(84,101,111,.045) 0 2px,transparent 2.5px),radial-gradient(circle at 47px 39px,rgba(84,101,111,.035) 0 3px,transparent 3.5px),linear-gradient(42deg,transparent 46%,rgba(84,101,111,.025) 47% 53%,transparent 54%);
    background-size: 74px 74px; }
  .row { display: flex; margin: 4px 0; }
  .row.me { justify-content: flex-end; }
  .bub { max-width: 94%; padding: 9px 10px 6px; border-radius: 9px; font-size: 13.5px; line-height: 1.48; box-shadow: 0 1px 1px rgba(11,20,26,.13); position: relative; word-break: break-word; overflow-x:auto; }
  .row.bot .bub { background: #fff; border-top-left-radius: 2px; }
  .row.me .bub { background: var(--wa-mint); border-top-right-radius: 2px; max-width:82%; }
  .ts { font-size: 10px; color: #667781; text-align: right; margin-top: 3px; }
  .bub b { color: #111b21; }
  .bub h4 { font-size: 14px; margin: 1px 0 7px; color: var(--wa-green); }
  .bub table { border-collapse: separate; border-spacing:0; margin: 8px 0 4px; font-size: 11.7px; width: 100%; min-width:480px; border:1px solid #dfe5e2; border-radius:8px; overflow:hidden; }
  .bub th { background: #eef8f3; color: var(--wa-dark); text-align: left; padding: 6px 7px; border-bottom: 1px solid #d8e8df; white-space: nowrap; font-weight:700; }
  .bub td { padding: 5px 7px; border-bottom: 1px solid #edf0ef; }
  .bub tr:last-child td { border-bottom:0; }
  .bub tr td:first-child { max-width: 220px; }
  .bub .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bub .red { color: #d32f2f; font-weight: 600; }
  .bub .amb { color: #e6870e; font-weight: 600; }
  .bub .grn { color: #1a8a4e; font-weight: 600; }
  .pill { display: inline-block; background: #eef9f4; color: var(--wa-dark); border: 1px solid #b8dfce; border-radius: 16px; padding: 5px 11px; margin: 4px 4px 1px 0; font-size: 12px; cursor: pointer; transition:.15s ease; }
  .pill:hover { background: #d3efe2; }
  .kv { display: grid; grid-template-columns: minmax(120px,1fr) auto; gap: 4px 16px; margin: 5px 0; }
  .kv div:nth-child(odd) { color: #54656f; }
  .kv div:nth-child(even) { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  /* typing indicator */
  .typing span { display: inline-block; width: 7px; height: 7px; margin: 0 1.5px; background: #9aa7ad; border-radius: 50%; animation: bl 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay: .18s } .typing span:nth-child(3){ animation-delay: .36s }
  @keyframes bl { 0%,70%,100%{ opacity:.3 } 35%{ opacity:1 } }
  /* chips + input */
  #chips { flex: 0 0 auto; padding: 7px 10px 3px; display: flex; flex-wrap: nowrap; overflow-x:auto; gap: 2px; background: #f0f2f5; scrollbar-width:none; }
  #chips::-webkit-scrollbar { display:none; }
  #chips .pill { white-space:nowrap; background:#fff; }
  #bar { flex: 0 0 auto; display: flex; gap: 8px; padding: 7px 10px calc(9px + env(safe-area-inset-bottom)); background: #f0f2f5; align-items: center; }
  #inp { flex: 1; min-width:0; border: 1px solid transparent; outline: none; border-radius: 24px; padding: 12px 16px; font-size: 14px; background: #fff; color:var(--ink); }
  #inp:focus { border-color:#9fd7c2; box-shadow:0 0 0 3px rgba(0,128,105,.09); }
  #snd { width: 46px; height: 46px; border: none; border-radius: 50%; background: var(--wa-green); color: #fff; font-size: 19px; cursor: pointer; flex: 0 0 auto; box-shadow:0 2px 7px rgba(0,128,105,.28); }
  #snd:hover { background: #017561; }
  #mic { width: 46px; height: 46px; border: none; border-radius: 50%; background: #fff; font-size: 18px; cursor: pointer; flex: 0 0 auto; color:#54656f; }
  #mic.rec { background: #ff3b30; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{ box-shadow: 0 0 0 0 rgba(255,59,48,.45) } 50%{ box-shadow: 0 0 0 9px rgba(255,59,48,0) } }
  .day { text-align: center; margin: 6px 0 10px; }
  .day span { background: #fff; color: #54656f; font-size: 11px; padding: 4px 10px; border-radius: 6px; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
  .acts { margin-top: 7px; border-top: 1px solid #edf0ef; padding-top: 5px; display: flex; gap: 3px; flex-wrap:wrap; }
  .acts button { border:0; background:transparent; border-radius:6px; padding:4px 7px; font-size: 11px; color: var(--wa-green); cursor: pointer; user-select: none; }
  .acts button:hover, .acts button:focus-visible { background:#eef8f3; outline:none; }
  #quote { display: none; background: #f0f2f5; border-left: 4px solid #008069; margin: 0; padding: 7px 12px; font-size: 12px; color: #54656f; justify-content: space-between; align-items: center; gap: 8px; }
  #quote.on { display: flex; }
  #qx { cursor: pointer; font-size: 16px; padding: 0 4px; }
  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #323232; color: #fff; padding: 8px 16px; border-radius: 18px; font-size: 12px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 9; }
  .metric-grid { display:grid; grid-template-columns:repeat(3,minmax(105px,1fr)); gap:7px; margin:8px 0; }
  .metric { border:1px solid #e2e8e5; border-radius:9px; padding:8px; background:#fbfdfc; min-width:0; }
  .metric span { display:block; color:var(--muted); font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .metric strong { display:block; color:var(--ink); font-size:14px; margin-top:2px; font-variant-numeric:tabular-nums; }
  .metric.risk { background:#fff5f4; border-color:#f6ccc8; }
  .metric.good { background:#f1faf4; border-color:#cce8d4; }
  .sales-stack { display:grid; gap:8px; margin:9px 0 4px; }
  .sales-block { border:1px solid #dfe8e4; border-radius:10px; padding:9px 10px; background:#fbfdfc; }
  .sales-block.total { background:linear-gradient(135deg,#eefaf5,#f9fffc); border-color:#abd9c7; }
  .sales-title { display:flex; justify-content:space-between; gap:10px; align-items:baseline; font-weight:800; font-size:13px; margin-bottom:4px; }
  .sales-title small { color:var(--muted); font-weight:500; font-size:10px; white-space:nowrap; }
  .sales-line { color:#54656f; font-size:11.5px; line-height:1.55; }
  .sales-line b { color:#087f5b; font-variant-numeric:tabular-nums; }
  .sales-line .period { color:#667781; font-size:10px; }
  .health-title { display:flex; justify-content:space-between; gap:10px; margin-top:9px; font-size:11px; color:var(--muted); }
  .healthbar { display:flex; height:8px; overflow:hidden; border-radius:99px; background:#e9edef; margin:4px 0 7px; }
  .healthbar i { display:block; min-width:2px; }
  .health-legend { display:flex; flex-wrap:wrap; gap:8px; color:var(--muted); font-size:10.5px; }
  .health-legend b { width:7px; height:7px; display:inline-block; border-radius:50%; margin-right:3px; }
  .privacy-note { color:var(--muted); font-size:11px; line-height:1.4; margin-top:8px; }
  #lock { position:fixed; inset:0; background:linear-gradient(155deg,#075e54,#008069 58%,#00a884); display:flex; align-items:center; justify-content:center; z-index:99; padding:22px; }
  .lock-card { background:#fff; border-radius:20px; padding:30px 26px 24px; max-width:360px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.28); }
  .lock-mark { width:72px; height:72px; border-radius:50%; background:linear-gradient(145deg,#46dd84,#15b957); color:#fff; font-weight:800; font-size:22px; display:grid; place-items:center; margin:0 auto 14px; box-shadow:inset 0 0 0 3px rgba(255,255,255,.28); }
  .lock-title { font-size:19px; font-weight:750; color:var(--ink); margin-bottom:5px; }
  #lockmsg { font-size:13px; color:var(--muted); margin:0 auto 17px; line-height:1.4; }
  #pass { width:100%; border:1px solid #cfd8d5; border-radius:11px; padding:12px 13px; font-size:15px; outline:none; margin-bottom:10px; }
  #pass:focus { border-color:var(--wa-green); box-shadow:0 0 0 3px rgba(0,128,105,.12); }
  #unlock { width:100%; border:none; border-radius:11px; background:var(--wa-green); color:#fff; padding:12px; font-size:14px; font-weight:700; cursor:pointer; }
  #unlock:hover { background:#017561; }
  .lock-foot { color:#86969f; font-size:10.5px; margin-top:13px; }
  @media (min-width:900px){ #app { height:calc(100dvh - 34px); margin:17px 0; border-radius:10px; overflow:hidden; } }
  @media (max-width:560px){
    body { background:var(--wa-paper); }
    #chat { padding:13px 8px 8px; }
    #hdr { padding-left:10px; padding-right:8px; }
    #hdr .av { width:42px; height:42px; }
    #hdr .t { font-size:15px; }
    .icon-btn { width:38px; height:38px; }
    .bub { max-width:97%; font-size:13px; }
    .row.me .bub { max-width:88%; }
    .metric-grid { grid-template-columns:repeat(2,minmax(100px,1fr)); }
    .bub table.brand-summary { min-width:0; table-layout:fixed; font-size:10.5px; }
    .brand-summary th, .brand-summary td { padding:5px 4px; }
    .brand-summary th:first-child, .brand-summary td:first-child { width:29%; overflow-wrap:anywhere; }
    .brand-summary th:nth-child(2), .brand-summary td:nth-child(2) { width:20%; }
    .brand-summary th:nth-child(5), .brand-summary td:nth-child(5) { width:18%; }
    .brand-summary th:nth-child(6), .brand-summary td:nth-child(6) { width:14%; }
    .brand-summary th:nth-child(7), .brand-summary td:nth-child(7) { width:19%; }
    .brand-summary th:nth-child(3), .brand-summary td:nth-child(3),
    .brand-summary th:nth-child(4), .brand-summary td:nth-child(4),
    .brand-summary th:nth-child(8), .brand-summary td:nth-child(8),
    .brand-summary th:nth-child(9), .brand-summary td:nth-child(9) { display:none; }
    #mic, #snd { width:43px; height:43px; }
  }
  @media (prefers-reduced-motion:reduce){ *,*:before,*:after{animation:none!important;transition:none!important;} }
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="av">FG</div>
    <div class="identity">
      <div class="t">FG Inventory Assistant <span class="verified" title="Verified data">✓</span></div>
      <div class="s" id="sub">loading…</div>
    </div>
    <div class="actions">
      <button id="installBtn" class="icon-btn" type="button" title="Install app" aria-label="Install app" hidden>＋</button>
      <button id="clearBtn" class="icon-btn" type="button" title="Clear chat history" aria-label="Clear chat history">🗑</button>
    </div>
  </div>
  <div id="chat"></div>
  <div id="chips"></div>
  <div id="quote"><span id="qtext"></span><span id="qx">&times;</span></div>
  <div id="toast"></div>
  <div id="bar">
    <input id="inp" type="text" placeholder="Message FG Inventory…" autocomplete="off" aria-label="Ask about FG inventory">
    <button id="mic" title="Voice command — say: FG, give me summary">&#127908;</button>
    <button id="snd" title="Send">&#10148;</button>
  </div>
</div>
<script>
window.__START=function(){
"use strict";
var chat = document.getElementById('chat'), inp = document.getElementById('inp');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function now(){ var d=new Date(); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
function fmtIN(n){ n=Math.round(n); return n.toLocaleString('en-IN'); }
function money(v){
  if (Math.abs(v) >= 1e7) return '₹' + (v/1e7).toFixed(2) + ' Cr';
  if (Math.abs(v) >= 1e5) return '₹' + (v/1e5).toFixed(2) + ' L';
  return '₹' + fmtIN(v);
}
function doiCls(d){ return d<=0?'':(d<21?'red':(d<=45?'amb':'grn')); }
function doiCell(d){ var c=doiCls(d); return '<td class="num '+c+'">'+(d?Math.round(d):'—')+'</td>'; }
function metric(label,value,tone){ return '<div class="metric '+(tone||'')+'"><span>'+esc(label)+'</span><strong>'+value+'</strong></div>'; }
function healthBar(bk){
  var total=Math.max(1,bk.r+bk.a+bk.g+bk.x);
  return '<div class="health-title"><b>DOI health</b><span>'+fmtIN(total)+' selling SKUs</span></div>'
    +'<div class="healthbar" aria-label="DOI health distribution">'
    +'<i style="width:'+(bk.r/total*100)+'%;background:#e05252"></i>'
    +'<i style="width:'+(bk.a/total*100)+'%;background:#f0ad3d"></i>'
    +'<i style="width:'+(bk.g/total*100)+'%;background:#38a169"></i>'
    +'<i style="width:'+(bk.x/total*100)+'%;background:#4091c9"></i></div>'
    +'<div class="health-legend"><span><b style="background:#e05252"></b>&lt;21d '+bk.r+'</span><span><b style="background:#f0ad3d"></b>21–45d '+bk.a+'</span><span><b style="background:#38a169"></b>46–90d '+bk.g+'</span><span><b style="background:#4091c9"></b>&gt;90d '+bk.x+'</span></div>';
}

function add(kind, html){
  var r=document.createElement('div'); r.className='row '+kind;
  r.innerHTML='<div class="bub">'+html+'<div class="ts">'+now()+(kind==='me'?' ✓✓':'')+'</div></div>';
  chat.appendChild(r); chat.scrollTop=chat.scrollHeight; return r;
}
var ACTS='<div class="acts"><button type="button" data-a="copy">⧉ Copy</button><button type="button" data-a="img">▣ Image</button><button type="button" data-a="wa">↗ WhatsApp</button><button type="button" data-a="reply">↩ Reply</button></div>';
function botReply(html){
  var t=add('bot','<span class="typing"><span></span><span></span><span></span></span>');
  setTimeout(function(){ t.querySelector('.bub').innerHTML=html+ACTS+'<div class="ts">'+now()+'</div>'; chat.scrollTop=chat.scrollHeight; pushLog('bot', html); }, 350);
}

/* ---------- persistent chat history (this device/browser only) ----------
   IMPORTANT: LOG_KEY must NEVER change across app versions/deploys. It is
   the localStorage key holding the user's saved conversation. Renaming it
   (e.g. to 'fg_chat_log_v2') orphans all existing history — the app would
   silently start a fresh empty chat for every returning user. Every future
   edit to this file must keep this exact key. If a breaking data-shape
   change to log entries is ever unavoidable, migrate old entries into the
   new shape on load instead of bumping the key. */
var LOG_KEY='fg_chat_log_v1';
function todayKey(){ return new Date().toISOString().slice(0,10); }
function loadLog(){ try{ return JSON.parse(localStorage.getItem(LOG_KEY)||'[]'); }catch(e){ return []; } }
function saveLog(){ try{ localStorage.setItem(LOG_KEY, JSON.stringify(CHATLOG.slice(-200))); }catch(e){} }
var CHATLOG = loadLog();
function pushLog(kind, html){ CHATLOG.push({k:kind, h:html, t:now(), day:todayKey()}); saveLog(); }
function addDayDivider(dayKey){
  var label = dayKey===todayKey() ? 'TODAY' : dDisp(dayKey);
  var div=document.createElement('div'); div.className='day'; div.innerHTML='<span>'+label+'</span>'; chat.appendChild(div);
}
function renderRestoredLog(){
  var lastDay=null;
  CHATLOG.forEach(function(m){
    if (m.day!==lastDay){ addDayDivider(m.day); lastDay=m.day; }
    var r=document.createElement('div'); r.className='row '+(m.k==='me'?'me':'bot');
    r.innerHTML='<div class="bub">'+m.h+(m.k==='bot'?ACTS:'')+'<div class="ts">'+m.t+(m.k==='me'?' ✓✓':'')+'</div></div>';
    chat.appendChild(r);
  });
  chat.scrollTop=chat.scrollHeight;
}
function clearChat(){
  CHATLOG.length=0; saveLog(); chat.innerHTML='';
  addDayDivider(todayKey());
  botReply('🧹 Chat history cleared.<br>Data: <b>'+esc(D.sourceFile)+'</b> ('+esc(D.reportDate)+', '+fmtIN(D.rowCount)+' rows, '+S.length+' SKUs).');
}
document.getElementById('clearBtn').onclick=function(){ clearChat(); };
function toast(msg){
  var el=document.getElementById('toast'); el.textContent=msg; el.style.opacity=1;
  setTimeout(function(){ el.style.opacity=0; }, 1800);
}
function bubbleText(bub){
  var c=bub.cloneNode(true);
  c.querySelectorAll('.acts,.ts').forEach(function(x){ x.remove(); });
  var t=c.innerText.replace(/\n{3,}/g,'\n\n').trim();
  return '📦 FG Inventory ('+D.reportDate+')\n'+t;
}
function copyText(t){
  function legacy(){
    var ta=document.createElement('textarea'); ta.value=t;
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(legacy); }
  else legacy();
}

if (!window.FG_DATA){
  document.getElementById('sub').textContent='no data';
  add('bot','<b>data.js not found.</b><br>Run <b>build_chat_data.py</b> in this folder to generate it from the latest FG_Inventory_Daily xlsx, then reload this page.');
  return;
}

var D = window.FG_DATA, S = D.skus;
var CS = D.secondarySales || null;
var CHANNELS = CS ? (CS.channels || []) : [];
var MONTH_HISTORY = CS ? (CS.monthlyHistory || {months:[],channels:[],latestTwoMonths:[],latestThreeMonths:[]}) : {months:[],channels:[],latestTwoMonths:[],latestThreeMonths:[]};
var H = D.history || {days:{}, meta:{}};
var HDATES = Object.keys(H.days).sort();           // YYYY-MM-DD ascending
function dShort(k){ return k.slice(8,10)+'-'+k.slice(5,7); }
function dDisp(k){ return k.slice(8,10)+'-'+k.slice(5,7)+'-'+k.slice(0,4); }
document.getElementById('sub').textContent = 'online • inventory ' + D.reportDate + (CS ? ' • sales through '+dDisp(CS.dataThrough) : '') + (HDATES.length>1 ? ' • '+HDATES.length+' days history' : '');

/* ---------- conversation context ---------- */
var CTX = { sku: null };
var byCode = {};
S.forEach(function(s){ byCode[s.code.toLowerCase()] = s; });

/* ---------- pre-computed aggregates ---------- */
var brands = {}, locTot = {};
S.forEach(function(s){
  var b = brands[s.brand] || (brands[s.brand]={soh:0,sit:0,val:0,drr:0,n:0,low:0,fresh80:0,freshLE80:0});
  b.soh+=s.soh; b.sit+=s.sit; b.val+=s.val; b.drr+=s.drr;
  b.fresh80+=(s.fresh80||0); b.freshLE80+=(s.freshLE80||0);
  if (s.soh>0) b.n++;
  if (s.drr>100 && s.doi>0 && s.doi<21) b.low++;
  s.locs.forEach(function(L){

function monthKeyFromText(text){
  var aliases={january:1,jan:1,february:2,feb:2,march:3,mar:3,april:4,apr:4,may:5,june:6,jun:6,july:7,jul:7,august:8,aug:8,september:9,sep:9,october:10,oct:10,november:11,nov:11,december:12,dec:12};
  var hit=Object.keys(aliases).find(function(name){return new RegExp('\\b'+name+'\\b').test(text);});
  if(!hit) return null;
  var month=String(aliases[hit]).padStart(2,'0');
  var yearHit=text.match(/\b20\d{2}\b/), candidates=MONTH_HISTORY.months.map(function(row){return row.month;}).filter(function(key){return key.slice(5,7)===month;});
  if(yearHit) return yearHit[0]+'-'+month;
  return candidates.length ? candidates[candidates.length-1] : null;
}

    h+='<tr><td>'+dShort(k)+'</td><td class="num">'+fmtIN(v[0])+'</td><td class="num">'+fmtIN(v[1])+'</td><td class="num">'+fmtIN(v[2])+'</td>'+doiCell(v[3])+'</tr>';
  });
  return h+'</table>';
}
function delta(a,b,fmt){
  var d=b-a, s=d>0?'+':'';
  return '<td class="num '+(d<0?'red':(d>0?'grn':''))+'">'+s+(fmt?fmt(d):fmtIN(d))+'</td>';
}
function rCompare(k1,k2){
  if (k1>k2){ var tmp=k1; k1=k2; k2=tmp; }
  var a=H.days[k1], b=H.days[k2];
  var doiA=a.t[3]>0?a.t[0]/a.t[3]:0, doiB=b.t[3]>0?b.t[0]/b.t[3]:0;
  var h='<h4>⚖️ '+dDisp(k1)+' vs '+dDisp(k2)+'</h4>'
    +'<table><tr><th>Metric</th><th class="num">'+dShort(k1)+'</th><th class="num">'+dShort(k2)+'</th><th class="num">Change</th></tr>'
    +'<tr><td>SOH</td><td class="num">'+fmtIN(a.t[0])+'</td><td class="num">'+fmtIN(b.t[0])+'</td>'+delta(a.t[0],b.t[0])+'</tr>'
    +'<tr><td>SIT</td><td class="num">'+fmtIN(a.t[1])+'</td><td class="num">'+fmtIN(b.t[1])+'</td>'+delta(a.t[1],b.t[1])+'</tr>'
    +'<tr><td>Value</td><td class="num">'+money(a.t[2])+'</td><td class="num">'+money(b.t[2])+'</td>'+delta(a.t[2],b.t[2],money)+'</tr>'
    +'<tr><td>DRR</td><td class="num">'+fmtIN(a.t[3])+'</td><td class="num">'+fmtIN(b.t[3])+'</td>'+delta(a.t[3],b.t[3])+'</tr>'
    +'<tr><td>DOI</td><td class="num">'+doiA.toFixed(1)+'</td><td class="num">'+doiB.toFixed(1)+'</td>'+delta(doiA,doiB,function(d){return d.toFixed(1);})+'</tr></table>';
  h+='<b>Brand-wise SOH change:</b><table><tr><th>Brand</th><th class="num">'+dShort(k1)+'</th><th class="num">'+dShort(k2)+'</th><th class="num">Change</th></tr>';
  var bset={}; Object.keys(a.b).concat(Object.keys(b.b)).forEach(function(x){bset[x]=1;});
  Object.keys(bset).map(function(bn){
    var s1=(a.b[bn]||[0])[0], s2=(b.b[bn]||[0])[0];
    return {bn:bn, s1:s1, s2:s2, d:Math.abs(s2-s1)};
  }).sort(function(x,y){return y.d-x.d;}).forEach(function(x){
    if(!x.s1 && !x.s2) return;
    h+='<tr><td>'+esc(x.bn)+'</td><td class="num">'+fmtIN(x.s1)+'</td><td class="num">'+fmtIN(x.s2)+'</td>'+delta(x.s1,x.s2)+'</tr>';
  });
  return h+'</table>';
}
var MONTHS={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
function findDate(t){
  var m=t.match(/\b(\d{1,2})[\-\/\. ]?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/);
  var dd,mm;
  if(m){ dd=m[1].padStart(2,'0'); mm=MONTHS[m[2]]; }
  else{
    m=t.match(/\b(\d{1,2})[\-\/](\d{1,2})(?:[\-\/](\d{2,4}))?\b/);
    if(!m) return null;
    dd=m[1].padStart(2,'0'); mm=m[2].padStart(2,'0');
  }
  var hit=HDATES.filter(function(k){return k.slice(8,10)===dd && k.slice(5,7)===mm;});
  return hit.length?hit[hit.length-1]:'none';
}

  bw:'BeBodywise',bb:'BeBodywise',bodywise:'BeBodywise',bebodywise:'BeBodywise','be bodywise':'BeBodywise',
  lj:'LittleJoys',littlejoys:'LittleJoys','little joys':'LittleJoys','root labs':'Root Labs',own:'OWN'};
var BRAND_TABS = '<br><b>Brand-wise top DRR:</b><br>'
  +pill('top drr mm','ManMatters')+pill('top drr lj','LittleJoys')
  +pill('top drr bw','BeBodywise')+pill('top drr own','OWN');
var SEARCH_STOP={how:1,much:1,many:1,stock:1,inventory:1,available:1,availability:1,please:1,give:1,show:1,tell:1,check:1,need:1,can:1,you:1,me:1,what:1,whats:1,is:1,are:1,do:1,we:1,have:1,has:1,for:1,of:1,the:1,in:1,at:1,details:1,detail:1,status:1,sku:1,product:1,item:1,units:1,unit:1,qty:1,quantity:1,current:1,today:1,where:1,location:1,soh:1,sit:1,doi:1,drr:1,freshness:1,fresh:1,expiry:1,expiring:1,shelf:1,life:1,sale:1,sales:1,secondary:1,channel:1,mtd:1,month:1,last:1,total:1,number:1,value:1};
function skuQueryWords(text){
  var cleaned=text.toLowerCase().replace(/\b(?:last\s+)?\d{1,3}\s*days?\b/g,' ');
  Object.keys(locTot).sort(function(a,b){return b.length-a.length;}).forEach(function(location){
    cleaned=cleaned.split(location.toLowerCase()).join(' ');
  });
  CHANNELS.forEach(function(channel){ cleaned=cleaned.split(channel.name.toLowerCase()).join(' '); });
  return cleaned.replace(/[^a-z0-9._%+-]+/g,' ').split(' ').filter(function(word){return word.length>1&&!SEARCH_STOP[word];});
}
function findSkuHits(text){
  var words=skuQueryWords(text);
  return S.filter(function(s){var hay=(s.code+' '+s.name).toLowerCase();return words.length&&words.every(function(word){return hay.indexOf(word)!==-1;});});
}

function answer(q){
  var raw=q.trim(), t=raw.toLowerCase().replace(/\s+/g,' ');
  if(!t) return null;

  if (/^(hi|hello|hey|namaste)\b/.test(t)) return 'Hi 👋 Ask me for any SKU, product, brand or location. '+pill('summary')+pill('low doi')+pill('help');
  if (/help|what can|commands?$/.test(t)) return rHelp();
  if (/\bwhat is (?:the )?through date\b|\bthrough date (?:meaning|means|definition)\b/.test(t)) {
    if(!CS) return '<h4>Through date</h4>It means the latest actual order date available in the Secondary Sales source, not the email or attachment date.';
    return '<h4>Through date</h4>It means the latest actual order date available in the Secondary Sales source, not the email or attachment date.<br><br>Overall Secondary Sales is currently through <b>'+dDisp(CS.dataThrough)+'</b>. Each channel can have its own earlier through date, and its DRR is calculated up to that channel’s latest available order date.';
  }

  /* how many days asked? e.g. "last 15 days", "15 day history" */
  var nDays=null, mN=t.match(/\b(?:last\s+)?(\d{1,3})\s*days?\b/);
  if (mN) nDays=parseInt(mN[1],10);
  var refThis=/\b(this|same|it|its|iska|isi|current)\b/.test(t);
  var channelMention=findChannel(t);

  /* compare two dates */
  if (/\b(compare|vs|versus)\b/.test(t)){
    var toks=t.match(/\d{1,2}[\-\/]\d{1,2}(?:[\-\/]\d{2,4})?|\d{1,2}[\-\/\. ]?(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*/g)||[];
    var keys=toks.map(function(x){return findDate(x);}).filter(function(k){return k && k!=='none';});
    if (keys.length>=2 && keys[0]!==keys[1]) return rCompare(keys[0], keys[1]);
    return 'To compare two days, say e.g. <b>compare '+dShort(HDATES[Math.max(0,HDATES.length-8)])+' vs '+dShort(HDATES[HDATES.length-1])+'</b>. Stored days: '+dShort(HDATES[0])+' to '+dShort(HDATES[HDATES.length-1])+'.';
  }

  /* history: dated summary, trends */
  var dk=findDate(t);
  if (dk==='none'){
    var avail=HDATES.slice(-10).map(function(k){return pill('summary '+dShort(k), dShort(k));}).join('');
    return 'No data stored for that date. Available days:<br>'+avail;
  }
  if (dk) return rDaySummary(dk) || rSummary();
  if (/\b(trend|history|day ?wise)\b/.test(t)){
    var rest=t
      .replace(/\b(?:last\s+)?\d{1,3}\s*days?\b/g,' ')
      .replace(/\b(trend|history|day ?wise|of|for|show|me|give|get|the|last|this|same|it|its|iska|isi|sku|item|product)\b/g,' ')
      .replace(/\s+/g,' ').trim();
    if (!rest || /^(overall|fg|inventory|summary|all)$/.test(rest)){
      if (refThis){
        if (CTX.sku && byCode[CTX.sku.toLowerCase()]) return rSkuTrend(byCode[CTX.sku.toLowerCase()], nDays);
        return 'Which SKU? Open one first (type its code or name), then ask "this sku trend".';
      }
      return rTrend(nDays);
    }
    var ex2=S.find(function(s){return s.code.toLowerCase()===rest;});
    if (ex2) return rSkuTrend(ex2, nDays);
    var w2=rest.split(' ').filter(function(w){return w.length>1;});
    var h2=S.filter(function(s){var hay=(s.code+' '+s.name).toLowerCase(); return w2.length && w2.every(function(w){return hay.indexOf(w)!==-1;});});
    if (h2.length===1) return rSkuTrend(h2[0], nDays);
    if (h2.length>1){
      h2.sort(function(a,b){return b.drr-a.drr;});
      var hh='<b>Which one? Tap for trend:</b><br>';
      h2.slice(0,10).forEach(function(s){ hh+=pill(s.code+' trend', s.name.slice(0,38)+' ('+s.code+')')+'<br>'; });
      return hh;
    }
    if (CTX.sku && byCode[CTX.sku.toLowerCase()]) return rSkuTrend(byCode[CTX.sku.toLowerCase()], nDays);
    return rTrend(nDays);
  }

  /* secondary sales: SKU-channel first, then channel/network summaries */
  if(CS && /\b(secondary|channel|sale|sales|mtd|month)\b/.test(t)){
    var secondaryHits=findSkuHits(t);
    var requestedMonth=monthKeyFromText(t);
    if(!channelMention && /\bchannel(?:\s|-)?(?:level|wise)\s+sales?\b|\bsales?\s+by\s+channel\b|\bchannel sales?\b/.test(t)) return rChannelLevelSales();
    if(/\blast\s*(?:2|two)\s*months?\b/.test(t)) return rMonthlyHistory(channelMention,null,true);
    if(requestedMonth && /\b(sale|sales|month|history)\b/.test(t)) return rMonthlyHistory(channelMention,requestedMonth,false);
    if(refThis && CTX.sku && /\b(channel|secondary|sale|sales|drr|mtd|month)\b/.test(t)){
      return rSkuChannels(byCode[CTX.sku.toLowerCase()],channelMention);
    }
    if(secondaryHits.length===1 && /\b(channel|secondary|sale|sales|drr|mtd|month)\b/.test(t)){
      return rSkuChannels(secondaryHits[0],channelMention);
    }
    if(channelMention && /\b(sale|sales|drr|mtd|month|secondary|channel)\b/.test(t)) return rChannel(channelMention);
    if(/\b(secondary sales?|channel sales?|channel drr|total sales?|sale number|sales summary|mtd sales?|last month sales?)\b/.test(t)) return rSecondarySummary();
  }

  var locationMention=Object.keys(locTot).sort(function(a,b){return b.length-a.length;}).find(function(L){return t.indexOf(L.toLowerCase())!==-1;});
  if (refThis && CTX.sku && locationMention){
    return rSkuLocation(byCode[CTX.sku.toLowerCase()],locationMention);
  }

  /* "this sku" / "it" without trend words -> show current card again */
  if (refThis && /\b(sku|item|product|detail|status|doi|drr|soh|sit|stock)\b/.test(t)){
    if (CTX.sku && byCode[CTX.sku.toLowerCase()]) return rSku(byCode[CTX.sku.toLowerCase()]);
    return 'I don\'t have a SKU in context yet — open one first (type its code or name), then ask about "this sku".';
  }

  if (/(fg )?(inventory )?summary|snapshot|overview|overall (fg|inventory)/.test(t)) return rSummary();

  var m=t.match(/doi\s*(?:<|below|under|less than)\s*(\d+)/) || (/low doi|risk|stock ?out/.test(t)?[0,'21']:null);
  if (m){
    var th=parseInt(m[1],10);
    var showAll=/\ball\b/.test(t);
    var minDrr=showAll?0:100;
    var list=S.filter(function(s){return s.drr>minDrr && s.soh>0 && s.doi>0 && s.doi<th;}).sort(function(a,b){return a.doi-b.doi;});
    if(!list.length) return 'No SKUs'+(showAll?'':' with DRR&gt;100')+' below '+th+' days DOI. ✅';
    return '<h4>⚠️ '+list.length+' SKUs below '+th+'d DOI'+(showAll?'':' (DRR&gt;100 only)')+'</h4>'+skuTable(list.slice(0,25))+(list.length>25?'<small>Showing first 25 of '+list.length+'.</small>':'')+(showAll?'':'<br><small>Filtered to DRR&gt;100 to hide low-velocity noise. For the unfiltered list ask "doi &lt; '+th+' all".</small>');
  }

  var naturalHits=findSkuHits(t);
  if (naturalHits.length===1 && (locationMention || /\b(stock|soh|sit|doi|drr|inventory|available|availability|fresh|freshness|expiry|location|where)\b/.test(t))){
    return locationMention?rSkuLocation(naturalHits[0],locationMention):rSku(naturalHits[0]);
  }

  if (/near[- ]?expiry|ageing|aging|expiring|freshness|shelf\s*life/.test(t)){
    var ageing=S.filter(function(s){return (s.freshLE80||0)>0;}).sort(function(a,b){return (b.freshLE80||0)-(a.freshLE80||0);});
    if(!ageing.length) return 'No ≤80% shelf-life stock is present in today\'s validated snapshot. ✅';
    return '<h4>🧪 Shelf-life attention · top '+Math.min(20,ageing.length)+'</h4><table><tr><th>SKU / Product</th><th>Brand</th><th class="num">≤80%</th><th class="num">SOH</th><th class="num">DOI</th></tr>'
      +ageing.slice(0,20).map(function(s){return '<tr><td>'+pill(s.code,s.code)+'<br><small>'+esc(s.name.slice(0,45))+'</small></td><td>'+esc(s.brand)+'</td><td class="num red">'+fmtIN(s.freshLE80)+'</td><td class="num">'+fmtIN(s.soh)+'</td>'+doiCell(s.doi)+'</tr>';}).join('')+'</table>';
  }
  if (/out of stock|zero stock|soh\s*(?:=|is)?\s*0/.test(t)){
    var zero=S.filter(function(s){return s.soh<=0&&s.drr>0;}).sort(function(a,b){return b.drr-a.drr;});
    return zero.length?'<h4>⛔ Selling SKUs with zero SOH</h4>'+skuTable(zero.slice(0,25)):'No selling SKU has zero SOH today. ✅';
  }
  if (/excess|overstock|high doi|doi\s*(?:>|above|over)\s*90/.test(t)){
    var excess=S.filter(function(s){return s.drr>0&&s.doi>90&&s.soh>0;}).sort(function(a,b){return b.val-a.val;});
    return excess.length?'<h4>📈 Excess cover · DOI above 90 days</h4>'+skuTable(excess.slice(0,25)):'No selling SKU is above 90 days DOI today.';
  }
  var topDrrBrandQ = t.match(/^top (?:drr|sell|mover)s?\s+(.+)$/);
  if (topDrrBrandQ){
    var bk2 = BRAND_ALIAS[topDrrBrandQ[1].trim()] || (Object.keys(brands).find(function(b){return b.toLowerCase()===topDrrBrandQ[1].trim();}));
    if (bk2){
      var l4=S.filter(function(s){return s.brand===bk2;}).sort(function(a,b){return b.drr-a.drr;}).slice(0,15);
      return '<h4>🏆 Top 15 by DRR — '+esc(bk2)+'</h4>'+skuTable(l4)+BRAND_TABS;
    }
  }
  if (/top (drr|sell|mover)|fastest/.test(t)){
    var l1=S.slice().sort(function(a,b){return b.drr-a.drr;}).slice(0,15);
    return '<h4>🏆 Top 15 by Overall DRR</h4>'+skuTable(l1)+BRAND_TABS;
  }
  if (/top value|highest value|inventory value/.test(t)){
    var l2=S.slice().sort(function(a,b){return b.val-a.val;}).slice(0,15);
    var h='<h4>💰 Top 15 by inventory value</h4><table><tr><th>SKU / Product</th><th class="num">Value</th><th class="num">SOH</th><th class="num">DOI</th></tr>';
    l2.forEach(function(s){ h+='<tr><td>'+pill(s.code,s.code)+'<br><small>'+esc(s.name.slice(0,45))+'</small></td><td class="num">'+money(s.val)+'</td><td class="num">'+fmtIN(s.soh)+'</td>'+doiCell(s.doi)+'</tr>'; });
    return h+'</table>';
  }
  if (/\bsit\b|transit/.test(t)){
    var l3=S.filter(function(s){return s.sit>0;}).sort(function(a,b){return b.sit-a.sit;});
    var tot=l3.reduce(function(a,s){return a+s.sit;},0);
    return '<h4>🚚 Stock in Transit — '+fmtIN(tot)+' units, '+l3.length+' SKUs</h4>'+skuTable(l3.slice(0,15))+(l3.length>15?'<small>Showing top 15.</small>':'');
  }

  var bk = BRAND_ALIAS[t] || (Object.keys(brands).find(function(b){return b.toLowerCase()===t;}));
  if (bk && brands[bk]){
    var b=brands[bk], doi=b.drr>0?b.soh/b.drr:0;
    var top=S.filter(function(s){return s.brand===bk;}).sort(function(a,b2){return b2.drr-a.drr;}).slice(0,10);
    var low=S.filter(function(s){return s.brand===bk&&s.drr>100&&s.soh>0&&s.doi>0&&s.doi<21;}).length;
    var h4b='<h4>'+esc(bk)+'</h4><div class="kv"><div>SOH</div><div>'+fmtIN(b.soh)+'</div><div>SIT</div><div>'+fmtIN(b.sit)+'</div><div>Value</div><div>'+money(b.val)+'</div><div>DRR</div><div>'+fmtIN(b.drr)+'</div><div>DOI</div><div>'+doi.toFixed(1)+' days</div><div>SKUs &lt;21d DOI (DRR&gt;100)</div><div>'+low+'</div></div><b>Top movers by DRR:</b>'+skuTable(top);
    h4b+=BRAND_TABS;
    return h4b;
  }

  var lk = Object.keys(locTot).find(function(L){return L.toLowerCase()===t || L.toLowerCase().indexOf(t)===0;});
  if (lk){
    var lt=locTot[lk];
    var ls=S.map(function(s){var f=s.locs.find(function(L){return L.n===lk;});return f?{s:s,L:f}:null;})
            .filter(Boolean).sort(function(a,b){return b.L.s-a.L.s;}).slice(0,15);
    var h2='<h4>📍 '+esc(lk)+'</h4><div class="kv"><div>SOH</div><div>'+fmtIN(lt.soh)+'</div><div>SIT</div><div>'+fmtIN(lt.sit)+'</div><div>SKUs stocked</div><div>'+lt.n+'</div></div>';
    h2+='<b>Top SKUs here:</b><table><tr><th>SKU / Product</th><th class="num">SOH</th><th class="num">SIT</th><th class="num">Loc DRR</th><th class="num">Loc DOI</th></tr>';
    ls.forEach(function(x){ h2+='<tr><td>'+pill(x.s.code,x.s.code)+'<br><small>'+esc(x.s.name.slice(0,45))+'</small></td><td class="num">'+fmtIN(x.L.s)+'</td><td class="num">'+fmtIN(x.L.t)+'</td><td class="num">'+fmtIN(x.L.r)+'</td>'+doiCell(x.L.d)+'</tr>'; });
    return h2+'</table>';
  }

  /* SKU search */
  var exact=S.find(function(s){return s.code.toLowerCase()===t;});
  if (exact) return rSku(exact);
  var hits=findSkuHits(t);
  if (hits.length===1) return rSku(hits[0]);
  if (hits.length>1){
    hits.sort(function(a,b){return b.drr-a.drr;});
    var h3='<b>'+hits.length+' matches for “'+esc(raw)+'”.</b> Tap one:<br>';
    hits.slice(0,10).forEach(function(s){ h3+=pill(s.code, s.name.slice(0,38)+' ('+s.code+')')+'<br>'; });
    if(hits.length>10) h3+='<small>Showing 10 — refine your search for more.</small>';
    return h3;
  }
  return 'Couldn\'t find “'+esc(raw)+'”. 🤔 Try a SKU code, product name, brand or: '+pill('summary')+pill('low doi')+pill('help');
}

/* ---------- wiring ---------- */
function ask(q){
  if (/^\s*(clear (chat|history)|reset chat|new chat)\s*$/i.test(q)){ add('me', esc(q)); pushLog('me', esc(q)); clearChat(); return; }
  add('me', esc(q));
  pushLog('me', esc(q));
  quoteBar.className=''; qtext.textContent='';
  var html;
  try { html = answer(q) || rHelp(); } catch(e){ html = 'Error: '+esc(e.message); }
  botReply(html);
}
window.__ask = function(q){ ask(q); };
document.getElementById('snd').onclick=function(){ if(inp.value.trim()){ ask(inp.value); inp.value=''; } inp.focus(); };
inp.addEventListener('keydown', function(e){ if(e.key==='Enter' && inp.value.trim()){ ask(inp.value); inp.value=''; } });

var chips=document.getElementById('chips');
['summary','secondary sales','channel level sale','last 2 months sale','channel drr','mtd sale','low doi','near expiry','top drr','help'].forEach(function(c){
  var el=document.createElement('span'); el.className='pill'; el.textContent=c; el.onclick=function(){ ask(c); };
  chips.appendChild(el);
});

/* ---------- message actions: copy / forward / reply ---------- */
var quoteBar=document.getElementById('quote'), qtext=document.getElementById('qtext');
document.getElementById('qx').onclick=function(){ quoteBar.className=''; qtext.textContent=''; };
chat.addEventListener('click', function(e){
  var a = e.target && e.target.getAttribute ? e.target.getAttribute('data-a') : null;
  if (!a) return;
  var bub = e.target.closest('.bub'); if (!bub) return;
  var txt = bubbleText(bub);
  if (a==='copy'){ copyText(txt); toast('Copied — paste anywhere ✓'); }
  if (a==='img'){
    if (!window.html2canvas){ toast('Image engine not loaded'); return; }
    toast('Rendering image…');
    window.html2canvas(bub, { backgroundColor:'#ffffff', scale:2,
      onclone:function(doc){ var els=doc.querySelectorAll('.acts'); for(var i=0;i<els.length;i++) els[i].remove(); }
    }).then(function(cv){
      cv.toBlob(function(blob){
        function dl(){
          var a2=document.createElement('a');
          a2.href=URL.createObjectURL(blob);
          a2.download='FG_'+D.reportDate+'_'+Date.now()+'.png';
          document.body.appendChild(a2); a2.click(); a2.remove();
          toast('Image downloaded ⬇ — share it from Downloads');
        }
        if (navigator.clipboard && window.ClipboardItem){
          navigator.clipboard.write([new ClipboardItem({'image/png':blob})])
            .then(function(){ toast('Image copied — paste in WhatsApp ✓'); }, dl);
        } else dl();
      }, 'image/png');
    }).catch(function(){ toast('Could not render image'); });
  }
  if (a==='wa'){
    var payload = txt.length>3500 ? txt.slice(0,3500)+'\n…(truncated)' : txt;
    window.open('https://wa.me/?text='+encodeURIComponent(payload), '_blank');
  }
  if (a==='reply'){
    var first = txt.split('\n').filter(function(l){return l.trim();})[1] || txt.slice(0,50);
    qtext.textContent = '↩ Replying to: ' + first.slice(0,60);
    quoteBar.className = 'on';
    var mm = txt.match(/\b[A-Z0-9]{4,}\.[A-Z0-9]+\.[A-Z0-9_.]+\b/);
    if (mm && byCode[mm[0].toLowerCase()]) CTX.sku = byCode[mm[0].toLowerCase()].code;
    inp.focus();
  }
});

/* ---------- voice commands: wake word "FG" ---------- */
var micBtn=document.getElementById('mic'), sub=document.getElementById('sub');
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec=null, listening=false, subDefault='';
function cleanVoice(t){
  t=t.toLowerCase()
   .replace(/\bd\s*o\s*i\b/g,'doi').replace(/\bd\s*r\s*r\b/g,'drr')
   .replace(/\bs\s*o\s*h\b/g,'soh').replace(/\bs\s*i\s*t\b/g,'sit')
   .replace(/\b(please|give me|show me|tell me|bata do|batao|check|what is|whats)\b/g,' ')
   .replace(/\bdata\b\s*$/,'').replace(/\s+/g,' ').trim();
  return t;
}
var WAKE=/^\s*(hey\s+|ok\s+)?(fg|f\s*g|effigy|fiji|fg[.,])\b[.,]?\s*/i;
function handleVoice(raw){
  var t=raw.trim();
  if (WAKE.test(t)){
    var cmd=cleanVoice(t.replace(WAKE,''));
    if(!cmd){ botReply('🎙️ Yes? Say <b>FG</b> followed by a command — e.g. "FG summary" or "FG low doi".'); return; }
    ask(cmd);
  } else if(listening){
    sub.textContent='heard: “'+raw.trim().slice(0,40)+'” — start with “FG”';
    setTimeout(function(){ if(listening) sub.textContent='🎙️ listening for “FG …”'; },2500);
  }
}
if (SR){
  rec=new SR(); rec.lang='en-IN'; rec.continuous=true; rec.interimResults=false;
  rec.onresult=function(e){ handleVoice(e.results[e.results.length-1][0].transcript); };
  rec.onerror=function(e){ if(e.error==='not-allowed'){ stopMic(); botReply('Microphone access was blocked. Allow mic permission for this page and tap 🎤 again.'); } };
  rec.onend=function(){ if(listening){ try{ rec.start(); }catch(err){} } };
}
function startMic(){ listening=true; micBtn.classList.add('rec'); subDefault=sub.textContent; sub.textContent='🎙️ listening for “FG …”'; try{ rec.start(); }catch(e){} }
function stopMic(){ listening=false; micBtn.classList.remove('rec'); if(subDefault) sub.textContent=subDefault; try{ rec.stop(); }catch(e){} }
micBtn.onclick=function(){
  if(!SR){ botReply('Voice needs Chrome or Edge — this browser doesn\'t support speech recognition.'); return; }
  listening ? stopMic() : startMic();
};

if (CHATLOG.length){
  renderRestoredLog();
  if (CHATLOG[CHATLOG.length-1].day !== todayKey()){
    addDayDivider(todayKey());
    var backHtml='👋 Welcome back. Today\'s verified inventory is ready: <b>'+esc(D.reportDate)+'</b> · '+fmtIN(D.rowCount)+' rows · '+S.length+' SKUs.'+(CS?'<br>Secondary sales are synced through <b>'+dDisp(CS.dataThrough)+'</b>.':'')+'<br>Your previous chat is above. Ask naturally, or tap a shortcut below.';
    add('bot', backHtml); pushLog('bot', backHtml);
  }
} else {
  addDayDivider(todayKey());
  var bootHtml='👋 <b>FG Inventory Assistant is ready.</b><br>Verified inventory: <b>'+esc(D.reportDate)+'</b> · '+fmtIN(D.rowCount)+' rows · '+S.length+' SKUs.'+(CS?'<br>Secondary sales: through <b>'+dDisp(CS.dataThrough)+'</b> · '+CHANNELS.length+' channels.':'')+'<br><br>Ask naturally — for example:<br>'+pill('summary','Today\'s summary')+pill('secondary sales','Secondary sales')+pill('channel level sale','Channel level sale')+pill('channel drr','Channel DRR')+pill('mtd sale','MTD sale')+pill('stock of nutrimix','Stock of a product')+pill('low doi','Low DOI')+'<div class="privacy-note">Your inventory stays encrypted until you unlock it. Chat history is saved only on this device.</div>';
  add('bot', bootHtml); pushLog('bot', bootHtml);
}
};
</script>

<div id="lock">
  <div class="lock-card">
    <div class="lock-mark">FG</div>
    <div class="lock-title">FG Inventory Assistant</div>
    <div id="lockmsg">Enter the team passcode to open today’s encrypted inventory.</div>
    <input id="pass" type="password" placeholder="Team passcode" autocomplete="current-password" aria-label="Team passcode">
    <button id="unlock" type="button">Unlock inventory</button>
    <div class="lock-foot">Secure team access · data decrypts only on this device</div>
  </div>
</div>
<script src="pako_inflate.min.js"></script>
<script>
(function(){
"use strict";
var ENC=null;
function b(x){ return Uint8Array.from(atob(x), function(c){return c.charCodeAt(0);}); }
async function decrypt(pass){
  var km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(ENC.salt),iterations:ENC.iter,hash:'SHA-256'}, km, {name:'AES-GCM',length:256}, false, ['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(ENC.iv)}, key, b(ENC.ct));
  if(ENC.zip==='gzip'){
    if(typeof DecompressionStream!=='undefined'){
      var stream=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
      pt=await new Response(stream).arrayBuffer();
    }else if(window.pako){
      pt=window.pako.ungzip(new Uint8Array(pt));
    }else{
      throw new Error('This browser needs an update to open the compressed inventory snapshot.');
    }
  }
  return JSON.parse(new TextDecoder().decode(pt));
}
var lock=document.getElementById('lock'), msg=document.getElementById('lockmsg'),
    passEl=document.getElementById('pass'), btn=document.getElementById('unlock');
async function tryUnlock(pass, silent){
  if(!ENC){ msg.textContent='Still downloading data\u2026 try again in a second.'; return; }
  try{
    btn.textContent='Unlocking\u2026';
    window.FG_DATA=await decrypt(pass);
    try{ localStorage.setItem('fg_pass', pass); }catch(e){}
    lock.remove();
    window.__START();
  }catch(e){
    btn.textContent='Unlock';
    if(!silent){ msg.textContent='Wrong passcode \u2014 try again.'; msg.style.color='#d32f2f'; passEl.value=''; passEl.focus(); }
  }
}
btn.onclick=function(){ if(passEl.value) tryUnlock(passEl.value,false); };
passEl.addEventListener('keydown', function(e){ if(e.key==='Enter'&&passEl.value) tryUnlock(passEl.value,false); });
fetch('data.enc.json',{cache:'no-cache'}).then(function(r){
  if(!r.ok) throw new Error(r.status);
  return r.json();
}).then(function(j){
  ENC=j;
  var saved=null; try{ saved=localStorage.getItem('fg_pass'); }catch(e){}
  if(saved) tryUnlock(saved,true); else passEl.focus();
}).catch(function(){ msg.textContent='Could not load data.enc.json \u2014 check the file is uploaded next to index.html.'; msg.style.color='#d32f2f'; });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
var installPrompt=null, installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',function(event){
  event.preventDefault(); installPrompt=event; installBtn.hidden=false;
});
installBtn.addEventListener('click',function(){
  if(!installPrompt) return;
  installPrompt.prompt();
  installPrompt.userChoice.finally(function(){installPrompt=null;installBtn.hidden=true;});
});
window.addEventListener('appinstalled',function(){installPrompt=null;installBtn.hidden=true;});
})();
</script>
